[project]
name = "shona-news"
version = "0.1.0"
description = "Shona versus English news topic classification: classical, multilingual and Africa-adapted encoders, and zero-shot LLMs."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Kudzai Mupita" }]
dependencies = [
    "accelerate>=1.15.0",
    "anthropic>=2.6.0",
    "datasets>=5.1.0",
    "numpy>=2.5.4",
    "protobuf>=7.36.2",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "sentencepiece>=0.2.3",
    "torch>=2.15.0",
    "transformers>=5.22.2",
    "typer>=0.28.0",
]

[project.scripts]
shona-news = "shona_news.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shona_news"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PTH", "PL", "C4"]
ignore = ["PLR0913", "PLR2004"]

[tool.mypy]
python_version = "3.12"
packages = ["shona_news"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: downloads datasets or models from the Hugging Face Hub"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]
